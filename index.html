<!DOCTYPE html>
<html>
<head>
  <title>My RoR Cars</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    img {
      width: 400px;
      border-radius: 12px;
      margin: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      padding: 20px;
      border-radius: 12px;
      color: white;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>My Rigs of Rods Pictures 🚗</h1>
  <p>All my artwork is made in Rigs of Rods.</p>

  <!-- Images -->
  <img src="honda.png" onclick="openPopup('honda.png')">
  <img src="toyota.png" onclick="openPopup('toyota.png')">
  <img src="VW.png" onclick="openPopup('VW.png')">
  <img src="Dodge.jpg" onclick="openPopup('Dodge.jpg')">

  <!-- Popup -->
  <div id="popup">
    <p>Download this image?</p>
    <button onclick="downloadImage()">Yes</button>
    <button onclick="closePopup()">No</button>
  </div>

  <!-- Script -->
  <script>
    let currentImage = "";
function downloadImage() {
  const link = document.createElement('a');
  link.href = currentImage;
  link.download = currentImage;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  closePopup();
}
  

    // Pinterest-style mouse effect
    document.addEventListener("mousemove", (e) => {
      const images = document.querySelectorAll("img");

      images.forEach(img => {
        const rect = img.getBoundingClientRect();

        const x = e.clientX - (rect.left + rect.width / 2);
        const y = e.clientY - (rect.top + rect.height / 2);

        img.style.transform = `translate(${x * 0.02}px, ${y * 0.02}px)`;
      });
    });
  </script>

</body>
</html>
